appId: io.silkwarp.desktop
productName: SilkWarp
copyright: Copyright © 2026 SilkWarp Team
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
  - package.json
extraResources:
  - from: resources/easytier
    to: easytier
  - from: resources/helper
    to: helper
  - from: resources/moonlight
    to: moonlight
    filter:
      - "**/*"
      - "!Moonlight Game Streaming Project/**"
      - "!**/Moonlight Game Streaming Project/**"
      - "!*.ini"
  - from: resources/installers
    to: installers
  - from: build/icon.png
    to: icon.png
asar: true
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: packaging/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SilkWarp
  artifactName: SilkWarp-Setup-${version}.exe
